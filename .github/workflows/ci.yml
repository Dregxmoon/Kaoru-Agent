name: CI

on:
  push:
    branches: [dev, produccion]
    tags: ['v*']
  pull_request:
    branches: [dev, produccion]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck (JSDoc estricto en core/)
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

  test:
    name: Tests (Electron runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Dependencias del sistema (build tools + libs de Electron)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Instalar dependencias (postinstall descarga Electron y reconstruye better-sqlite3)
        run: npm ci

      - name: Indexar intenciones (init_vectors.js → data/core.db)
        run: ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron infrastructure/database/init_vectors.js

      - name: Regresión completa
        run: npm test

  e2e-ui:
    name: E2E UI (Electron + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Dependencias del sistema (Electron + xvfb para headless UI)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb

      - name: Instalar dependencias
        run: npm ci

      - name: E2E UI (ventana de chat + overlay)
        run: xvfb-run -a env ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron tests/e2e/test_ui_electron.js

      - name: Subir screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-ui-screenshots
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  # Build de instaladores en cada SO nativo (mejor que wine) + auto-update.
  # En tags v* publica los binarios y los latest*.yml a GitHub Releases
  # (electron-builder --publish always) → electron-updater encuentra la
  # actualización. En produccion (sin tag) solo sube artifacts.
  build:
    name: Build ${{ matrix.os }} · auto-update
    runs-on: ${{ matrix.os }}
    needs: [quality, test]
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    if: github.ref == 'refs/heads/produccion' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: asistente-linux
            pattern: dist/*.AppImage dist/*.deb dist/latest-linux.yml
          - os: macos-latest
            target: mac
            artifact: asistente-mac
            pattern: dist/*.dmg dist/*.zip dist/latest-mac.yml
          - os: windows-latest
            target: win
            artifact: asistente-win
            pattern: dist/*.exe dist/latest.yml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Dependencias del sistema (Linux — FUSE para AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Instalar dependencias (postinstall descarga Electron + rebuild de nativos)
        run: npm ci

      - name: Empaquetar y publicar (tags) / solo empaquetar (branch)
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            npm run publish:${{ matrix.target }}
          else
            npm run build:${{ matrix.target }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS sin firma (identity null en build config); nunca intentar
          # firmar/notarizar desde CI sin certificados.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: warn

  # En tags v* el job build ya publica; este paso solo deja notas y el
  # cuerpo de la release para cuando electron-builder cree la release.
  release:
    name: Release notes (tag v*)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Extraer versión del tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Crear/completar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Asistente v${{ steps.tag.outputs.name }}
          generate_release_notes: true
          append_body: true
